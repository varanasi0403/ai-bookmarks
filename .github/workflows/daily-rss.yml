name: RSS snapshot backup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-rss.yml'
      - 'cloud/scripts/publish_feed.py'
      - 'app/main.py'
permissions:
  contents: write
concurrency:
  group: daily-rss-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated collector dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Collect RSS into the public news snapshot
        run: .venv/bin/python cloud/scripts/publish_feed.py
      - name: Persist the refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/
          if git diff --cached --quiet; then
            echo 'No feed changes to publish.'
          else
            git commit -m 'Refresh daily RSS feed'
            git push
          fi
