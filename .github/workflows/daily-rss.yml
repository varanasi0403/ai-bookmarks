name: Daily RSS collection
on:
  schedule:
    - cron: '30 1 * * *' # Around 07:00 Asia/Kolkata; GitHub may delay scheduled jobs.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-rss-collection
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated collector dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Collect RSS and publish to AI BookMarks
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: .venv/bin/python cloud/scripts/collect.py
